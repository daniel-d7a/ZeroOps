name: zeroops

services:
  platform-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER:-zeroops}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD in .env}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-zeroops}
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLATFORM_DB_USER:-zeroops} -d ${PLATFORM_DB_NAME:-zeroops}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - platform
    restart: unless-stopped

  student-db:
    image: postgres:16-alpine
    container_name: student-db
    environment:
      POSTGRES_PASSWORD: ${STUDENT_DB_PASSWORD:?set STUDENT_DB_PASSWORD in .env}
    volumes:
      - student-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - db
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    command: ["rabbitmq-zeroops.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-zeroops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD:?set RABBITMQ_DEFAULT_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/entrypoint.sh:/usr/local/bin/rabbitmq-zeroops.sh:ro
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl list_queues --quiet name | grep -qx build.q"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - platform
    restart: unless-stopped

  traefik:
    image: traefik:v3
    container_name: traefik
    ports:
      - "8080:80"   # host 80 is taken by Apache; apps live on <slug>.localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-dynamic:/dynamic
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - edge
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      target: prod
    environment:
      PORT: 3000
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PUBLIC_PORT: ${PUBLIC_PORT:-8080}
      MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-3}
      UPLOADS_DIR: /data/uploads
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-zeroops}:${RABBITMQ_DEFAULT_PASSWORD}@rabbitmq:5672
      PLATFORM_DB_URL: postgres://${PLATFORM_DB_USER:-zeroops}:${PLATFORM_DB_PASSWORD}@platform-db:5432/${PLATFORM_DB_NAME:-zeroops}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.console-api.rule=Host(`console.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.console-api.entrypoints=web"
      - "traefik.http.services.console-api.loadbalancer.server.port=3000"
    networks:
      - platform
      - edge
    restart: unless-stopped

  web:
    build:
      context: ./services/web
      target: prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.console-web.rule=Host(`console.localhost`)"
      - "traefik.http.routers.console-web.entrypoints=web"
      - "traefik.http.services.console-web.loadbalancer.server.port=80"
    networks:
      - edge
    restart: unless-stopped

  # Railpack's BuildKit daemon — the worker builds student images through it.
  buildkit:
    image: moby/buildkit:buildx-stable-1
    container_name: buildkit
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "buildctl debug workers >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - platform
    restart: unless-stopped

  # One-shot: applies SQL migrations, exits. api/worker start only if this
  # exits 0 (fail-fast on a broken migration).
  migrate:
    build:
      context: ./services/api
      target: prod
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      PLATFORM_DB_URL: postgres://${PLATFORM_DB_USER:-zeroops}:${PLATFORM_DB_PASSWORD}@platform-db:5432/${PLATFORM_DB_NAME:-zeroops}
    depends_on:
      platform-db:
        condition: service_healthy
    restart: "no"
    networks:
      - platform

  worker:
    build:
      context: ./services/worker
    environment:
      NODE_ID: node-1
      WORKER_ROLES: build,run
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      BUILDKIT_HOST: docker-container://buildkit
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - uploads:/data/uploads:ro
      - traefik-dynamic:/dynamic
      - work:/work
    networks:
      - platform
      - db
    restart: unless-stopped

networks:
  platform:
    name: platform
  db:
    name: db
  edge:
    name: edge

volumes:
  platform-db-data:
  student-db-data:
  rabbitmq-data:
  traefik-dynamic:
  uploads:
  work:
